# code/pyproject.toml
# StaTable packaging foundation (v3.0 / Phase S-1)
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statable"
version = "3.4.3"
description = "MISRA C:2012-aware state machine design and C code generation for embedded systems"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Hideki Akashi" }]
keywords = [
    "state machine",
    "MISRA",
    "embedded",
    "code generation",
    "C",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
]

[project.optional-dependencies]
gui = ["PySide6>=6.0"]
dev = ["pytest>=7.0", "pycparser", "mypy>=1.10", "coverage>=7.0"]

[project.scripts]
statable-cli = "statable.cli:main"

[project.urls]
Homepage = "https://github.com/akashi-hideki/StaTable"
Repository = "https://github.com/akashi-hideki/StaTable"
Issues = "https://github.com/akashi-hideki/StaTable/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["statable*", "codegen*", "statable_gui*"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Phase 1a: keep untyped defs allowed for gradual adoption.
disallow_untyped_defs = false
disallow_incomplete_defs = false
strict_optional = true

# Exclude tests and patch scripts (Phase 1a scope).
exclude = [
    "^tests/",
    "^tools/patches/",
    "^__pycache__/",
]

# Per-module overrides to silence known-noisy modules until Phase 1c.

# ---- Phase 1a: overrides (see patch_v3_5_s2_mypy_fix.py) ----

# PySide6 type stubs are incomplete (e.g. Qt.ItemIsUserCheckable).
# Suppress all errors inside modules that use PySide6 so the
# baseline error count reflects the non-GUI code base.
[[tool.mypy.overrides]]
module = ["statable_gui.*", "PySide6.*", "PySide6.*.*"]
ignore_errors = true

# codegen: try/except ImportError aliasing (import X as Y with a
# fallback definition) is intentional and trips no-redef.
[[tool.mypy.overrides]]
module = ["codegen.*", "statable.*"]
disable_error_code = ["no-redef"]
